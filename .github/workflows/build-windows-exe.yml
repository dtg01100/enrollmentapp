name: build-windows-exe

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'src/apple_device_cli/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard ordered-set
          # Pull in runtime deps so Nuitka can resolve imports.
          pip install typer pymobiledevice3 cryptography rich pyinstaller

      # The entrypoint is src/apple_device_cli/cli.py and it does
      # `from apple_device_cli import __version__`. Nuitka needs
      # src/ on PYTHONPATH at compile time so the package root is
      # reachable; otherwise the resulting binary raises
      # ``ModuleNotFoundError: No module named 'apple_device_cli'``
      # the moment cli.py runs. This mirrors the host-side fix in
      # python-exe-build's guest/linux/build.py.
      - name: Nuitka build (onefile)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:PYTHONPATH = "$PWD/src;$env:PYTHONPATH"
          python -m nuitka `
            --onefile `
            --msvc=2022 `
            --enable-console `
            --output-filename=ios-enroll.exe `
            --output-dir=dist `
            --remove-output `
            --assume-yes-for-downloads `
            --include-package=apple_device_cli `
            src/apple_device_cli/cli.py

      - name: Verify PE header
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("dist/ios-enroll.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error "Not a valid PE file (MZ magic missing)"
            exit 1
          }
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset+1] -ne 0x45) {
            Write-Error "PE signature missing"
            exit 1
          }
          $size = (Get-Item dist/ios-enroll.exe).Length
          Write-Host "ios-enroll.exe: $size bytes, valid PE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-enroll-windows-exe
          path: dist/ios-enroll.exe
          if-no-files-found: error